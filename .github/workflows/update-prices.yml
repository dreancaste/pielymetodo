name: Update product prices

on:
  schedule:
    # 19:00 UTC = 16:00 Argentina (ART, UTC-3)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-commit:
    # Runs on the maintainer's own PC (residential IP) — cosmetologasargentinas.com
    # started Cloudflare-challenging GitHub-hosted runner IPs, blocking the login.
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # No --with-deps here: that flag shells out to apt-get and only works on Linux runners.
      - run: npx playwright install chromium

      - name: Scrape current prices
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: npm run scrape-products

      - name: Commit and push if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- src/data/products.ts
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No price changes."
          } else {
            git add src/data/products.ts
            git commit -m "chore: update product prices"
            git push
          }
